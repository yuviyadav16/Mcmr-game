name: Build Android & iOS Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Force Recreate Native Folders
        run: |
          rm -rf android ios
          flutter create --project-name chai_and_chase --platforms android,ios .

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate App Icon
        run: dart run flutter_launcher_icons

      # ==========================================
      # 100% BULLETPROOF PYTHON FIX FOR MAC
      # ==========================================
      - name: Fix Android SDK Version
        run: |
          python3 -c "
          import os
          for f in ['android/app/build.gradle', 'android/app/build.gradle.kts']:
              if os.path.exists(f):
                  content = open(f).read()
                  open(f, 'w').write(content.replace('flutter.compileSdkVersion', '36'))
          "

      # ==========================================
      # ANDROID BUILD & UPLOAD (APK)
      # ==========================================
      - name: Build Release APK (Android)
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Chai-and-Chase-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1

      # ==========================================
      # iPHONE BUILD & UPLOAD (iOS)
      # ==========================================
      - name: Build Release iOS
        run: flutter build ios --release --no-codesign

      - name: Upload iPhone Build
        uses: actions/upload-artifact@v4
        with:
          name: Chai-and-Chase-iPhone-App
          path: build/ios/iphoneos
          retention-days: 1
