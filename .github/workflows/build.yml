name: Build Android & iOS Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Create Native Folders
        run: |
          rm -rf android ios
          flutter create --project-name chai_and_chase --platforms android,ios .

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate App Icon
        run: dart run flutter_launcher_icons

      # ==========================================
      # NO HACKS! DIRECT BUILD (Latest packages will auto-fix everything)
      # ==========================================
      
      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Chai-and-Chase-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1

      - name: Build iOS App
        run: flutter build ios --release --no-codesign

      - name: Upload iPhone Build
        uses: actions/upload-artifact@v4
        with:
          name: Chai-and-Chase-iPhone-App
          path: build/ios/iphoneos
          retention-days: 1
