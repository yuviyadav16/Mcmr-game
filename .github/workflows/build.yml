name: Build Android & iOS Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Force Recreate Native Folders
        run: |
          rm -rf android ios
          flutter create --project-name chai_and_chase --platforms android,ios .

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate App Icon
        run: dart run flutter_launcher_icons

      # ==========================================
      # BULLETPROOF PYTHON SCRIPT TO FORCE SDK 36
      # ==========================================
      - name: Force CompileSdk to 36
        run: |
          python3 -c "
          import glob
          for f in glob.glob('android/app/build.gradle*'):
              print(f'Checking {f}')
              with open(f, 'r') as file:
                  content = file.read()
              
              # Sabhi possible patterns ko 36 se replace kar do
              content = content.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
              content = content.replace('compileSdkVersion flutter.compileSdkVersion', 'compileSdkVersion 36')
              content = content.replace('compileSdk = flutter.compileSdkVersion.toInt()', 'compileSdk = 36')
              
              # Agar phir bhi na ho toh direct line rewrite kar do
              if 'compileSdk' in content:
                  lines = content.split('\n')
                  new_lines = []
                  for line in lines:
                      if 'compileSdk' in line and '=' in line:
                          new_lines.append('    compileSdk = 36')
                      else:
                          new_lines.append(line)
                  content = '\n'.join(new_lines)

              with open(f, 'w') as file:
                  file.write(content)
              print(f'Successfully updated {f} to SDK 36!')
          "

      # ==========================================
      # ANDROID BUILD & UPLOAD (APK)
      # ==========================================
      - name: Build Release APK (Android)
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Chai-and-Chase-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1

      # ==========================================
      # iPHONE BUILD & UPLOAD (iOS)
      # ==========================================
      - name: Build Release iOS
        run: flutter build ios --release --no-codesign

      - name: Upload iPhone Build
        uses: actions/upload-artifact@v4
        with:
          name: Chai-and-Chase-iPhone-App
          path: build/ios/iphoneos
          retention-days: 1
