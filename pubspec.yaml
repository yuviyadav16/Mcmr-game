name: chai_and_chase
description: 3D Endless Runner Game
version: 1.0.0+1

# BAS YE 2 LINES ADD KARNI HAIN 👇
environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  video_player: ^2.8.2
  audioplayers: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/Image/Logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/Image/
    - assets/Video/
    - assets/audio/
