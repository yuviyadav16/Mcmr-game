name: chai_and_chase
description: 3D Endless Runner Game
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Naye aur latest versions jo automatically naye SDK ko support karte hain
  shared_preferences: ^2.3.2
  video_player: ^2.9.2
  audioplayers: ^6.1.1
  # Z++ Security & Cloud Backend ke liye Firebase Packages
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/Image/Logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    # Purane Folders
    - assets/Image/
    - assets/Video/
    - assets/audio/
    
    # Naye AAA Game Engine Folders Jo Tumne Banaye Hain
    - assets/audio/sfx/player/
    - assets/audio/sfx/enemy/
    - assets/gb/
    - assets/trains/
    - assets/obstacles/
    - assets/players/
    - assets/inspector/
    - assets/animations/
